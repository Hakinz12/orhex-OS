[project]
name = "orhrex-api"
version = "0.1.0"
description = "ORHREX OS Backend API — Intelligence That Anticipates"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0.35",
    "greenlet>=3.1.1",
    "aiosqlite>=0.20.0",
    "memwal==0.2.1",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
    "pynacl>=1.6.2",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "app"
]
